<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apps</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Apps">
<meta name="theme-color" content="#f1ede4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--bg:#f1ede4;--ink:#0e0e10}
@media(prefers-color-scheme:dark){:root{--bg:#0c0c0e;--ink:#f4f1ea;color-scheme:dark}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#msg{display:none;padding:32px;max-width:520px}
</style>
</head>
<body>
<iframe id="app" title="Apps"></iframe>
<div id="msg">Paste your Apps Script /exec link into APP_URL at the top of this file's script.</div>
<script>
var APP_URL = 'https://script.google.com/macros/s/AKfycbyH9gjyOqhy6vmtu9PuBD9R59YqDf4p0Qcn94tc2lV5BRkTzu4EdGkmqI9lOeZT626S/exec'; // your launcher Apps Script /exec link (the only line you ever edit in this file)
if (/^https:\/\/script\.google\.com\/.+\/exec$/.test(APP_URL)) {
  document.getElementById('app').src = APP_URL;
} else {
  document.getElementById('app').style.display = 'none';
  document.getElementById('msg').style.display = 'block';
}
</script>
</body>
</html>
